<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate Hub | Exclusive Offers & Guides</title>
<style>
:root{--bg:#0b1220;--panel:#121b2e;--p2:#172238;--line:#25324d;--text:#e8edf7;--muted:#9aa8c3;--acc:#2dd4bf;--accd:#0f766e;--on:#04201c;--wa:#22c55e;--tg:#229ed9;--yt:#ef4444;--warn:#f59e0b;--danger:#ef4444;--inp:#0e1626}
[data-theme=light]{--bg:#f3f6fb;--panel:#fff;--p2:#f7f9fd;--line:#d9e1ef;--text:#14213d;--muted:#5b6b88;--acc:#0d9488;--accd:#0f766e;--on:#fff;--inp:#f3f6fb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Noto Sans Devanagari','Mangal',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:20px}
button{cursor:pointer;border:none;font-family:inherit;font-weight:600;transition:.2s}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:transparent;color:var(--muted);padding:7px 14px;border-radius:8px;font-size:13px}
.seg button.on{background:var(--acc);color:var(--on)}
.pill{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:13px}
.pill:hover{border-color:var(--acc)}.pill.on{background:var(--accd);color:#fff;border-color:var(--acc)}
.adm{display:none}.admin .adm{display:inline-block}.admin .adm.flex{display:flex}
.hero{background:linear-gradient(180deg,var(--panel),var(--p2));border:1px solid var(--line);border-radius:20px;padding:30px 22px;text-align:center;margin-bottom:20px;position:relative}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);background:var(--inp);margin-bottom:12px}
.hero h1{font-size:27px}.tag-line{color:var(--acc);font-weight:600;margin:2px 0 8px}
.bio{color:var(--muted);max-width:660px;margin:0 auto 12px}
.badge{display:inline-block;background:rgba(45,212,191,.12);color:var(--acc);border:1px solid rgba(45,212,191,.35);font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600}
.hero .pill{position:absolute;top:14px;right:14px;font-size:12px;padding:7px 12px}
.stats,.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat{text-align:center}.stat b{display:block;font-size:24px;color:var(--acc)}.stat span{font-size:12px;color:var(--muted)}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:8px}
.step h3{font-size:15px}.step p{font-size:13px;color:var(--muted)}
h2.st{font-size:20px;margin:6px 0 14px;padding-left:12px;border-left:4px solid var(--acc)}
.inp,.f{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--text);font:inherit;font-size:14px}
.f{padding:9px 11px;margin-bottom:11px}textarea.f{min-height:66px;resize:vertical}
.inp:focus,.f:focus{outline:2px solid var(--acc);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.chip{background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:6px 14px;border-radius:20px;font-size:13px}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;transition:.25s}
.card:hover{border-color:var(--acc)}.card.expired{opacity:.55}.card.feat{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.ctop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tg{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(45,212,191,.12);color:var(--acc)}
.tg.f1{background:var(--acc);color:var(--on)}.tg.w{background:rgba(245,158,11,.18);color:var(--warn)}.tg.d{background:rgba(239,68,68,.18);color:var(--danger)}
.name{font-size:19px;font-weight:700}
.ico{background:var(--p2);color:var(--text);width:34px;height:34px;border-radius:8px;border:1px solid var(--line)}
.ico:hover{background:var(--warn);color:#000}.ico.x:hover{background:var(--danger);color:#fff}
.ben{background:rgba(45,212,191,.08);border-left:4px solid var(--acc);border-radius:8px;padding:11px 14px;margin:12px 0}
.ben small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--acc);font-weight:700}
details{margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--p2)}
summary{cursor:pointer;font-weight:600;font-size:14px}details ol{margin:8px 0 2px 20px;font-size:14px;color:var(--muted)}details li{margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .inp{flex:1;min-width:190px;padding:10px 12px;font-size:13px}
.btn{padding:10px 15px;border-radius:10px;font-size:13px;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.copy{background:var(--acc);color:var(--on)}.wa{background:var(--wa)}.tgb{background:var(--tg)}.yt{background:var(--yt);margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:24px}
.addw{display:none;text-align:center;margin:22px 0}.admin .addw{display:block}
.addw .row{justify-content:center}.dash{background:transparent;color:var(--acc);border:2px dashed var(--acc);padding:13px 24px;border-radius:12px;font-size:15px}
.disc{margin-top:28px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--muted);background:var(--panel)}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin:20px 0 8px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--acc);color:var(--on);padding:11px 22px;border-radius:30px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:2000;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.ov{display:none;position:fixed;inset:0;background:rgba(3,7,18,.7);align-items:center;justify-content:center;padding:16px;z-index:1000}
.ov.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
.modal h3{color:var(--acc);margin-bottom:6px}.hint{font-size:12px;color:var(--muted);margin-bottom:12px}
.modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px}.chk input{width:auto;margin:0}
.mact{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.cancel{background:var(--p2);color:var(--text);padding:10px 16px;border-radius:9px}.save{background:var(--acc);color:var(--on);padding:10px 18px;border-radius:9px}
@media(max-width:680px){.stats,.steps{grid-template-columns:1fr}.hero h1{font-size:22px}.hero .pill{position:static;margin-bottom:10px}}
.modal.wide{max-width:780px}.sharebox{margin-bottom:24px}
.fb{background:#1877f2}.xx{background:#111;border:1px solid #333}.li{background:#0a66c2}.mail{background:#6b7280}.more{background:var(--accd)}.go{background:#f59e0b;color:#1a1100}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:22px;color:var(--acc)}.kpi span{font-size:11px;color:var(--muted)}
.sc{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 14px}.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl th{color:var(--muted);font-weight:600}
.sh4{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin:14px 0 6px}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px;margin:6px 0 4px}.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}.bar i{display:block;width:70%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.feed{list-style:none;font-size:13px;color:var(--muted)}.feed li{padding:5px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <div class="brand"><i></i>Affiliate Hub</div>
  <div class="acts">
   <div class="seg"><button id="bEn" onclick="setLang('en')">English</button><button id="bHi" onclick="setLang('hi')">हिन्दी</button></div>
   <button class="pill" id="bTheme" onclick="toggleTheme()"></button>
   <button class="pill adm" onclick="openStats()" data-i="analytics"></button>
   <button class="pill adm" id="bExport" onclick="exportPage()" data-i="export"></button>
   <button class="pill" id="bAdmin" onclick="toggleAdmin()"></button>
  </div>
 </div>
 <section class="hero">
  <button class="pill adm" onclick="openProfile()" data-i="editProfile"></button>
  <img class="avatar" id="pImg" alt="Profile photo">
  <h1 id="pName"></h1><div class="tag-line" id="pTag"></div><p class="bio" id="pBio"></p>
  <span class="badge" data-i="verified"></span>
 </section>
 <section class="stats">
  <div class="box stat"><b id="sCount">0</b><span data-i="sLinks"></span></div>
  <div class="box stat"><b>100%</b><span data-i="sFree"></span></div>
  <div class="box stat"><b id="sLive">0</b><span data-i="sLive"></span></div>
 </section>
 <h2 class="st" data-i="how"></h2>
 <section class="steps">
  <div class="box step"><div class="n">1</div><h3 data-i="s1t"></h3><p data-i="s1d"></p></div>
  <div class="box step"><div class="n">2</div><h3 data-i="s2t"></h3><p data-i="s2d"></p></div>
  <div class="box step"><div class="n">3</div><h3 data-i="s3t"></h3><p data-i="s3d"></p></div>
 </section>
 <section class="box sharebox"><h2 class="st" style="margin-top:0" data-i="shareTitle"></h2>
  <p class="bio" style="margin:0 0 10px;max-width:none" data-i="shareDesc"></p>
  <p class="bio" id="shareNote" style="color:var(--acc);font-weight:600;margin:0 0 10px;max-width:none;display:none"></p>
  <div class="row" id="shareBtns"><button class="btn wa" data-ch="whatsapp">WhatsApp</button><button class="btn tgb" data-ch="telegram">Telegram</button><button class="btn fb" data-ch="facebook">Facebook</button><button class="btn xx" data-ch="x">X</button><button class="btn li" data-ch="linkedin">LinkedIn</button><button class="btn mail" data-ch="email" data-i="shEmail"></button><button class="btn mail" data-ch="sms">SMS</button><button class="btn copy" data-ch="copy" data-i="shCopy"></button><button class="btn more" data-ch="native" id="shNative" style="display:none" data-i="shMore"></button></div></section>
 <h2 class="st" data-i="offers"></h2>
 <input class="inp" id="q" data-ph="search" oninput="renderCards()">
 <div class="chips" id="chips"></div>
 <div id="list"></div>
 <div class="addw"><div class="row"><button class="dash" onclick="openOffer()" data-i="addNew"></button></div></div>
 <div class="disc" data-i="disc"></div>
 <footer><span id="yr"></span> &copy; Affiliate Hub. <span data-i="rights"></span></footer>
</div>
<div class="toast" id="toast"></div>

<div class="ov" id="ovOffer"><div class="modal"><h3 id="mOfferT"></h3><p class="hint" data-i="autoHint"></p><div id="offerForm"></div>
 <div class="mact"><button class="pill" onclick="forceAll(offerPairs)" data-i="autoBtn"></button><span class="row"><button class="cancel" onclick="closeOv('ovOffer')" data-i="cancel"></button><button class="save" onclick="saveOffer()" data-i="save"></button></span></div></div></div>
<div class="ov" id="ovProfile"><div class="modal"><h3 data-i="editProfile"></h3><p class="hint" data-i="autoHint"></p><div id="profileForm"></div>
 <div class="mact"><button class="pill" onclick="forceAll(profilePairs)" data-i="autoBtn"></button><span class="row"><button class="cancel" onclick="closeOv('ovProfile')" data-i="cancel"></button><button class="save" onclick="saveProfile()" data-i="save"></button></span></div></div></div>
<div class="ov" id="ovPw"><div class="modal"><h3 data-i="adminLogin"></h3><label data-i="pwLabel"></label><input class="f" type="password" id="pw" onkeydown="if(event.key==='Enter')checkPw()">
 <div class="mact"><span></span><span class="row"><button class="cancel" onclick="closeOv('ovPw')" data-i="cancel"></button><button class="save" onclick="checkPw()" data-i="login"></button></span></div></div></div>

<div class="ov" id="ovStats"><div class="modal wide"><div class="mact" style="margin:0 0 6px"><h3 data-i="analytics" style="margin:0"></h3><span class="row"><button class="pill" onclick="renderStats()" data-i="refresh"></button><button class="pill" onclick="exportCsv()" data-i="exportCsv"></button><button class="pill" onclick="clearLocal()" data-i="clearLocal"></button><button class="cancel" onclick="closeStats()">&#10005;</button></span></div><div id="statsBody"></div></div></div>

function offlineTranslate(text){let out=text,hit=false;DICT.slice().sort((a,b)=>b[0].length-a[0].length).forEach(function(p){const re=new RegExp("\\b"+p[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","gi");const before=out;out=out.replace(re,p[1]);if(out!==before)hit=true;});return hit?out:text}
function splitChunks(text,max){const parts=text.match(/[^.!?।]+[.!?।]*\s*/g)||[text];const out=[];let cur="";parts.forEach(function(s){while(s.length>max){if(cur){out.push(cur);cur=""}out.push(s.slice(0,max));s=s.slice(max)}if((cur+s).length>max){out.push(cur);cur=s}else cur+=s});if(cur.trim())out.push(cur);return out.map(function(x){return x.trim()}).filter(Boolean)}
function daysLeft(exp,now){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(exp||"");if(!m)return null;const a=Date.UTC(+m[1],+m[2]-1,+m[3]);const b=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((a-b)/86400000)}

/* ---------- auto translation ---------- */
async function translateOnline(text){const out=[];for(const c of splitChunks(text,450)){const ctl=new AbortController();const h=setTimeout(()=>ctl.abort(),7000);try{const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(c)+"&langpair=en|hi",{signal:ctl.signal});if(!r.ok)throw new Error("http");const j=await r.json();const tx=j&&j.responseData&&j.responseData.translatedText;if(!tx||Number(j.responseStatus)!==200||/MYMEMORY WARNING/i.test(tx))throw new Error("bad");out.push(tx)}finally{clearTimeout(h)}}return out.join(" ")}
async function translateText(text){const res=[];let offline=false;for(const ln of text.split("\n")){if(!ln.trim()){res.push("");continue}if(!offline){try{res.push(await translateOnline(ln.trim()));continue}catch(e){offline=true}}res.push(offlineTranslate(ln.trim()))}return{text:res.join("\n"),offline:offline}}
function runPair(p,force){const s=$(p.src),d=$(p.dst),text=s.value.trim();if(force)d.dataset.manual="0";if(d.dataset.manual==="1")return;if(!text){d.value="";return}const my=++p.token;d.placeholder=t("translating");translateText(text).then(function(r){if(my!==p.token)return;d.value=r.text;d.placeholder="";if(r.offline)toast("tOff")}).catch(function(){d.placeholder=""})}
function forceAll(pairs){pairs.forEach(p=>runPair(p,true))}
function wirePairs(pairs){pairs.forEach(function(p){p.token=0;p.timer=null;$(p.src).addEventListener("input",function(){clearTimeout(p.timer);p.timer=setTimeout(()=>runPair(p,false),800)});$(p.dst).addEventListener("input",function(){$(p.dst).dataset.manual="1"})})}
function armPairs(pairs,editing){pairs.forEach(p=>{$(p.dst).dataset.manual=(editing&&$(p.dst).value.trim())?"1":"0"})}

  return`<article class="card${d!==null&&d<0?" expired":""}${o.featured?" feat":""}" data-id="${o.id}">

  <div class="ben"><small>${esc(t("benefit"))}</small>${esc(ben)}</div>
  ${steps.length?`<details><summary>${esc(t("steps"))} (${steps.length})</summary><ol>${steps.map(s=>"<li>"+esc(s)+"</li>").join("")}</ol></details>`:""}
  <div class="row"><input class="inp" readonly value="${esc(o.link)}"><button class="btn go" data-a="open">${esc(t("openOffer"))}</button><button class="btn copy" data-a="copy">${esc(t("copy"))}</button><button class="btn wa" data-a="wa">WhatsApp</button><button class="btn tgb" data-a="tg">Telegram</button></div>
  ${video?`<a class="btn yt" data-a="video" href="${esc(video)}" target="_blank" rel="noopener noreferrer">&#9654; ${esc(t("watch"))}</a>`:""}</article>`}).join("")}

 if(a==="copy"||a==="wa"||a==="tg"||a==="open"||a==="video")track(a==="wa"||a==="tg"?"share":a==="open"?"click":a,o.id,a==="wa"?"whatsapp":a==="tg"?"telegram":"");
 if(a==="open"){window.open(o.link,"_blank","noopener");return}
 if(a==="copy")copyText(o.link);else if(a==="wa")window.open("https://wa.me/?text="+msg,"_blank","noopener");else if(a==="tg")window.open("https://t.me/share/url?url="+encodeURIComponent(o.link)+"&text="+encodeURIComponent(T[lang].share(o.name,"")),"_blank","noopener");else if(a==="edit")openOffer(o.id);else if(a==="del")delOffer(o.id)});
function copyText(text){const fb=function(){const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);toast(ok?"tCopied":"tCopyFail")};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>toast("tCopied"),fb);else fb()}

/* ---------- tracking & analytics ---------- */
const LS_EV="hubEvents";
const REF=(new URLSearchParams(location.search).get("ref")||"").replace(/[^\w-]/g,"").slice(0,20);
/*TRK_START*/
function vid(){try{let v=localStorage.getItem("hubVid");if(!v){v=Math.random().toString(36).slice(2,8);localStorage.setItem("hubVid",v)}return v}catch(e){return "anon"}}
function track(type,offerId,extra){
 if(isAdmin)return;
 const me=vid(),ev={t:Date.now(),type:type,offer:offerId||0,x:extra||"",ref:REF===me?"":REF,v:me};
 try{const a=JSON.parse(localStorage.getItem(LS_EV)||"[]");a.push(ev);localStorage.setItem(LS_EV,JSON.stringify(a.slice(-2000)))}catch(e){}
 if(FIREBASE_URL){try{fetch(FIREBASE_URL.replace(/\/$/,"")+"/events.json",{method:"POST",body:JSON.stringify(ev),keepalive:true}).catch(function(){})}catch(e){}}
}
/*TRK_END*/
/*AGG_START*/
function aggregate(events,offers,now){
 const tot={visit:0,click:0,copy:0,share:0,video:0,pageShare:0},per={},ch={},refs={},days=[],dayMap={},seen={};
 const dk=function(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
 offers.forEach(function(o){per[o.id]={click:0,copy:0,share:0,video:0}});
 for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const o={key:dk(d),label:d.getDate()+"/"+(d.getMonth()+1),visits:0,actions:0};days.push(o);dayMap[o.key]=o}
 const list=events.filter(function(e){return e&&typeof e.type==="string"&&typeof e.t==="number"});
 list.forEach(function(e){
  if(tot[e.type]!==undefined)tot[e.type]++;
  if(per[e.offer]&&per[e.offer][e.type]!==undefined)per[e.offer][e.type]++;
  if((e.type==="share"||e.type==="pageShare")&&e.x)ch[e.x]=(ch[e.x]||0)+1;
  if(e.type==="visit"){if(e.v)seen[e.v]=1;if(e.ref)refs[e.ref]=(refs[e.ref]||0)+1}
  const d=dayMap[dk(new Date(e.t))];if(d){if(e.type==="visit")d.visits++;else d.actions++}
 });
 return{tot:tot,per:per,ch:ch,refs:refs,days:days,uniq:Object.keys(seen).length,recent:list.slice().sort(function(a,b){return b.t-a.t}).slice(0,12)}
}
/*AGG_END*/
async function loadEvents(){
 if(FIREBASE_URL){const r=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/events.json?orderBy=%22%24key%22&limitToLast=2000");if(!r.ok)throw new Error("http "+r.status);const j=await r.json();return{events:Object.values(j||{}),live:true}}
 let a=[];try{a=JSON.parse(localStorage.getItem(LS_EV)||"[]")}catch(e){}
 return{events:a,live:false}
}
let statTimer=null;
function openStats(){if(!isAdmin)return;openOv("ovStats");renderStats();clearInterval(statTimer);statTimer=setInterval(renderStats,8000)}
function closeStats(){clearInterval(statTimer);closeOv("ovStats")}
async function renderStats(){
 if(!$("ovStats").classList.contains("show")){clearInterval(statTimer);return}
 try{paintStats(await loadEvents())}catch(e){$("statsBody").innerHTML='<div class="empty">'+esc(t("tStatErr"))+"</div>"}
}
function paintStats(r){
 const a=aggregate(r.events,offers,new Date()),n=x=>Number(x).toLocaleString(),nm=id=>{const o=offers.find(x=>x.id===id);return o?o.name:""};
 const kp=[["stVisits",a.tot.visit],["stUniq",a.uniq],["stClicks",a.tot.click],["stCopies",a.tot.copy],["stShares",a.tot.share],["stPageShares",a.tot.pageShare],["stVideos",a.tot.video]];
 const max=Math.max(1,...a.days.map(d=>d.visits+d.actions));
 const top=o=>Object.keys(o).sort((x,y)=>o[y]-o[x]).slice(0,8);
 let h=`<span class="tg ${r.live?"f1":"w"}">${r.live?"&#9679; "+esc(t("liveTag")):esc(t("localTag"))}</span> <span class="hint">${esc(t("updated"))}: ${new Date().toLocaleTimeString()}</span>`;
 if(!r.live)h+=`<p class="hint" style="margin-top:8px">${esc(t("localNote"))}</p>`;
 h+='<div class="kpis">'+kp.map(k=>`<div class="kpi"><b>${n(k[1])}</b><span>${esc(t(k[0]))}</span></div>`).join("")+"</div>";
 h+=`<div class="sh4">${esc(t("perOffer"))}</div><div class="sc"><table class="tbl"><tr><th>${esc(t("colOffer"))}</th><th>${esc(t("colClicks"))}</th><th>${esc(t("colCopies"))}</th><th>${esc(t("colShares"))}</th><th>${esc(t("colVideos"))}</th></tr>`+offers.map(o=>{const p=a.per[o.id];return`<tr><td>${esc(o.name)}</td><td>${n(p.click)}</td><td>${n(p.copy)}</td><td>${n(p.share)}</td><td>${n(p.video)}</td></tr>`}).join("")+"</table></div>";
 h+=`<div class="sh4">${esc(t("last7"))}</div><div class="bars">`+a.days.map(d=>{const v=d.visits+d.actions;return`<div class="bar" title="${v}"><i style="height:${Math.round(v/max*80)}%"></i>${esc(d.label)}</div>`}).join("")+"</div>";
 const chs=top(a.ch),rfs=top(a.refs);
 h+=`<div class="sh4">${esc(t("channels"))}</div><div class="row">`+(chs.length?chs.map(k=>`<span class="tg">${esc(k)}: ${n(a.ch[k])}</span>`).join(""):`<span class="hint">${esc(t("noData"))}</span>`)+"</div>";
 h+=`<div class="sh4">${esc(t("referrers"))}</div><div class="row">`+(rfs.length?rfs.map(k=>`<span class="tg">${esc(k)}: ${n(a.refs[k])}</span>`).join(""):`<span class="hint">${esc(t("noData"))}</span>`)+"</div>";
 h+=`<div class="sh4">${esc(t("recent"))}</div>`+(a.recent.length?'<ul class="feed">'+a.recent.map(e=>`<li>${esc(new Date(e.t).toLocaleString())} &mdash; ${esc(t("ev_"+e.type)||e.type)}${nm(e.offer)?" &middot; "+esc(nm(e.offer)):""}${e.x?" ("+esc(e.x)+")":""}</li>`).join("")+"</ul>":`<div class="hint">${esc(t("noData"))}</div>`);
 $("statsBody").innerHTML=h;
}
function dl(text,name,type){const url=URL.createObjectURL(new Blob(["\ufeff"+text],{type:type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportCsv(){if(!isAdmin)return;loadEvents().then(function(r){const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';const rows=[["time","type","offer","channel","ref","visitor"].join(",")].concat(r.events.slice().sort((x,y)=>x.t-y.t).map(function(e){const o=offers.find(z=>z.id===e.offer);return[new Date(e.t).toISOString(),e.type,o?o.name:"",e.x,e.ref,e.v].map(q).join(",")}));dl(rows.join("\n"),"affiliate_stats.csv","text/csv")}).catch(()=>toast("tStatErr"))}
function clearLocal(){if(!isAdmin||!confirm(t("confirmClear")))return;try{localStorage.removeItem(LS_EV)}catch(e){}renderStats()}

/* ---------- share whole page ---------- */
function pageUrl(){return(PUBLIC_URL||location.href.split(/[?#]/)[0])+"?ref="+vid()}
function sharePage(ch){
 const url=pageUrl(),txt=T[lang].pageShare(profile.name),e=encodeURIComponent;
 if(location.protocol==="file:"&&!PUBLIC_URL)toast("tNoUrl");
 track("pageShare",0,ch);
 if(ch==="copy"){copyText(url);return}
 if(ch==="native"){if(navigator.share)navigator.share({title:profile.name,text:txt,url:url}).catch(function(){});return}
 const map={whatsapp:"https://wa.me/?text="+e(txt+" "+url),telegram:"https://t.me/share/url?url="+e(url)+"&text="+e(txt),facebook:"https://www.facebook.com/sharer/sharer.php?u="+e(url),x:"https://twitter.com/intent/tweet?url="+e(url)+"&text="+e(txt),linkedin:"https://www.linkedin.com/sharing/share-offsite/?url="+e(url),email:"mailto:?subject="+e(profile.name)+"&body="+e(txt+"\n"+url),sms:"sms:?&body="+e(txt+" "+url)};
 if(!map[ch])return;
 if(ch==="email"||ch==="sms")location.href=map[ch];else window.open(map[ch],"_blank","noopener");
}
