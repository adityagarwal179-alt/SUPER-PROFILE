function offlineTranslate(text){let out=text,hit=false;DICT.slice().sort((a,b)=>b[0].length-a[0].length).forEach(function(p){const re=new RegExp("\\b"+p[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","gi");const before=out;out=out.replace(re,p[1]);if(out!==before)hit=true;});return hit?out:text}
function splitChunks(text,max){const parts=text.match(/[^.!?।]+[.!?।]*\s*/g)||[text];const out=[];let cur="";parts.forEach(function(s){while(s.length>max){if(cur){out.push(cur);cur=""}out.push(s.slice(0,max));s=s.slice(max)}if((cur+s).length>max){out.push(cur);cur=s}else cur+=s});if(cur.trim())out.push(cur);return out.map(function(x){return x.trim()}).filter(Boolean)}

async function translateOnline(text){const out=[];for(const c of splitChunks(text,450)){const ctl=new AbortController();const h=setTimeout(()=>ctl.abort(),7000);try{const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(c)+"&langpair=en|hi",{signal:ctl.signal});if(!r.ok)throw new Error("http");const j=await r.json();const tx=j&&j.responseData&&j.responseData.translatedText;if(!tx||Number(j.responseStatus)!==200||/MYMEMORY WARNING/i.test(tx))throw new Error("bad");out.push(tx)}finally{clearTimeout(h)}}return out.join(" ")}
async function translateText(text){const res=[];let offline=false;for(const ln of text.split("\n")){if(!ln.trim()){res.push("");continue}if(!offline){try{res.push(await translateOnline(ln.trim()));continue}catch(e){offline=true}}res.push(offlineTranslate(ln.trim()))}return{text:res.join("\n"),offline:offline}}
function runPair(p,force){const s=$(p.src),d=$(p.dst),text=s.value.trim();if(force)d.dataset.manual="0";if(d.dataset.manual==="1")return;if(!text){d.value="";return}const my=++p.token;d.placeholder=t("translating");translateText(text).then(function(r){if(my!==p.token)return;d.value=r.text;d.placeholder="";if(r.offline)toast("tOff")}).catch(function(){d.placeholder=""})}

const enc=new TextEncoder();
const b64=function(buf){let s="";new Uint8Array(buf).forEach(function(b){s+=String.fromCharCode(b)});return btoa(s)};
const unb64=function(s){return Uint8Array.from(atob(s),function(ch){return ch.charCodeAt(0)})};
async function derive(user,pass,salt,it){const key=await crypto.subtle.importKey("raw",enc.encode(user.trim().toLowerCase()+"\u0000"+pass),"PBKDF2",false,["deriveBits"]);return b64(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:it},key,256))}
async function makeAdmin(user,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),it=210000;return{salt:b64(salt),it:it,hash:await derive(user,pass,salt,it)}}
async function verifyAdmin(rec,user,pass){return(await derive(user,pass,unb64(rec.salt),rec.it))===rec.hash}
function passOk(user,pass){const u=user.trim();if(u.length<4||pass.length<10||pass.toLowerCase()===u.toLowerCase())return false;const k=[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(function(r){return r.test(pass)}).length;return k>=3}

function readImage(file,max,type){return new Promise(function(res,rej){
 if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type)){rej(new Error("type"));return}
 if(file.size>8*1024*1024){rej(new Error("size"));return}
 const fr=new FileReader();fr.onerror=function(){rej(new Error("read"))};
 fr.onload=function(){const im=new Image();im.onerror=function(){rej(new Error("decode"))};
  im.onload=function(){try{const s=fitSize(im.naturalWidth,im.naturalHeight,max),cv=document.createElement("canvas");cv.width=s.w;cv.height=s.h;const cx=cv.getContext("2d");if(type==="image/jpeg"){cx.fillStyle="#fff";cx.fillRect(0,0,s.w,s.h)}cx.drawImage(im,0,0,s.w,s.h);const out=cv.toDataURL(type,.82);if(out.length>700000)rej(new Error("big"));else res(out)}catch(e){rej(e)}};
  im.src=fr.result};

function periodStart(p,now){return p?new Date(now.getFullYear(),now.getMonth(),now.getDate()-(p===1?0:p-1)).getTime():0}
function activeNow(events,now){const seen={},cut=now.getTime()-300000;events.forEach(function(e){if(e&&e.v&&typeof e.t==="number"&&e.t>=cut&&e.t<=now.getTime()+60000)seen[e.v]=1});return Object.keys(seen).length}
function aggregate(events,offers,now,nDays){
 nDays=nDays||7;
 const tot={visit:0,view:0,click:0,copy:0,share:0,video:0,pageShare:0,poster:0},per={},ch={},refs={},dev={},lng={},src={},hours=[],days=[],dayMap={},seen={};
 const dk=function(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
 for(let h=0;h<24;h++)hours.push(0);
 offers.forEach(function(o){per[o.id]={view:0,click:0,copy:0,share:0,video:0}});
 for(let i=nDays-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const o={key:dk(d),label:d.getDate()+"/"+(d.getMonth()+1),visits:0,actions:0};days.push(o);dayMap[o.key]=o}
 const list=events.filter(function(e){return e&&typeof e.type==="string"&&typeof e.t==="number"});
 list.forEach(function(e){
  if(tot[e.type]!==undefined)tot[e.type]++;
  if(per[e.offer]&&per[e.offer][e.type]!==undefined)per[e.offer][e.type]++;
  if((e.type==="share"||e.type==="pageShare")&&e.x)ch[e.x]=(ch[e.x]||0)+1;
  if(e.type==="visit"){
   if(e.v)seen[e.v]=1;if(e.ref)refs[e.ref]=(refs[e.ref]||0)+1;
   if(e.d)dev[e.d]=(dev[e.d]||0)+1;if(e.l)lng[e.l]=(lng[e.l]||0)+1;if(e.s)src[e.s]=(src[e.s]||0)+1;
   hours[new Date(e.t).getHours()]++}
  const d=dayMap[dk(new Date(e.t))];if(d){if(e.type==="visit")d.visits++;else d.actions++}
 });
 return{tot:tot,per:per,ch:ch,refs:refs,dev:dev,lng:lng,src:src,hours:hours,days:days,uniq:Object.keys(seen).length,recent:list.slice().sort(function(a,b){return b.t-a.t}).slice(0,12)}
}
