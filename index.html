function offlineTranslate(text){let out=text,hit=false;DICT.slice().sort((a,b)=>b[0].length-a[0].length).forEach(function(p){const re=new RegExp("\\b"+p[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","gi");const before=out;out=out.replace(re,p[1]);if(out!==before)hit=true;});return hit?out:text}
function splitChunks(text,max){const parts=text.match(/[^.!?।]+[.!?।]*\s*/g)||[text];const out=[];let cur="";parts.forEach(function(s){while(s.length>max){if(cur){out.push(cur);cur=""}out.push(s.slice(0,max));s=s.slice(max)}if((cur+s).length>max){out.push(cur);cur=s}else cur+=s});if(cur.trim())out.push(cur);return out.map(function(x){return x.trim()}).filter(Boolean)}
function daysLeft(exp,now){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(exp||"");if(!m)return null;const a=Date.UTC(+m[1],+m[2]-1,+m[3]);const b=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((a-b)/86400000)}

/* ---------- auto translation ---------- */
async function translateOnline(text){const out=[];for(const c of splitChunks(text,450)){const ctl=new AbortController();const h=setTimeout(()=>ctl.abort(),7000);try{const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(c)+"&langpair=en|hi",{signal:ctl.signal});if(!r.ok)throw new Error("http");const j=await r.json();const tx=j&&j.responseData&&j.responseData.translatedText;if(!tx||Number(j.responseStatus)!==200||/MYMEMORY WARNING/i.test(tx))throw new Error("bad");out.push(tx)}finally{clearTimeout(h)}}return out.join(" ")}
async function translateText(text){const res=[];let offline=false;for(const ln of text.split("\n")){if(!ln.trim()){res.push("");continue}if(!offline){try{res.push(await translateOnline(ln.trim()));continue}catch(e){offline=true}}res.push(offlineTranslate(ln.trim()))}return{text:res.join("\n"),offline:offline}}
function runPair(p,force){const s=$(p.src),d=$(p.dst),text=s.value.trim();if(force)d.dataset.manual="0";if(d.dataset.manual==="1")return;if(!text){d.value="";return}const my=++p.token;d.placeholder=t("translating");translateText(text).then(function(r){if(my!==p.token)return;d.value=r.text;d.placeholder="";if(r.offline)toast("tOff")}).catch(function(){d.placeholder=""})}
function forceAll(pairs){pairs.forEach(p=>runPair(p,true))}
function wirePairs(pairs){pairs.forEach(function(p){p.token=0;p.timer=null;$(p.src).addEventListener("input",function(){clearTimeout(p.timer);p.timer=setTimeout(()=>runPair(p,false),800)});$(p.dst).addEventListener("input",function(){$(p.dst).dataset.manual="1"})})}
function armPairs(pairs,editing){pairs.forEach(p=>{$(p.dst).dataset.manual=(editing&&$(p.dst).value.trim())?"1":"0"})}

 var seq=[
  ["Your "+nm+" offer is still waiting","आपका "+nm+" ऑफ़र अभी भी इंतज़ार कर रहा है",

  ["Finish "+nm+" and claim your benefit",""+nm+" पूरा करें और अपना लाभ पाएँ",
   "Here is what you get: "+(ben||"a verified sign-up benefit")+" Complete the steps today so you do not miss out."+ends,
   "आपको मिलेगा: "+(benHi||"एक सत्यापित साइन-अप लाभ")+" आज ही स्टेप्स पूरे करें ताकि मौका हाथ से न जाए।"+endsHi],
  ["Quick tip: "+nm+" in 3 easy steps",nm+" सिर्फ़ 3 आसान स्टेप्स में",
   "Stuck somewhere? Open the guide, follow the steps in order and you are done."+ends,
   "कहीं अटक गए? गाइड खोलें, स्टेप्स क्रम से अपनाएँ और काम पूरा।"+endsHi],
  ["Reminder: "+nm+" offer may end soon","याद दिलाना: "+nm+" ऑफ़र जल्द समाप्त हो सकता है",
   "Offers can change without notice. "+(ben?ben+" ":"")+"Secure yours now."+ends,
   "ऑफ़र बिना सूचना के बदल सकते हैं। "+(benHi?benHi+" ":"")+"अभी अपना लाभ सुरक्षित करें।"+endsHi],
  ["Still thinking about "+nm+"?","क्या आप अभी भी "+nm+" के बारे में सोच रहे हैं?",
   "Your pending offer is saved. Come back any time and pick up where you left off.",
   "आपका अधूरा ऑफ़र सुरक्षित है। जब चाहें वापस आएँ और वहीं से शुरू करें जहाँ छोड़ा था।"],
  ["Last reminder for "+nm,nm+" के लिए अंतिम रिमाइंडर",
   "This is our final reminder for this offer. Complete it now, or ignore this email and we will not send more about it.",
   "यह इस ऑफ़र के लिए हमारा अंतिम रिमाइंडर है। अभी पूरा करें, या इस ईमेल को अनदेखा करें; हम इसके बारे में और ईमेल नहीं भेजेंगे।"]
 ];
 var s=seq[Math.min(n,seq.length-1)],clean=function(t){return t.replace(/\s+/g," ").trim()};
 var en=clean(s[2]),hi=clean(s[3]),link=x.link||o.link||siteUrl();
 return{
  to_email:l.email,to_name:l.email.split("@")[0],from_name:c.fromName,reply_to:l.email,
  subject:s[0]+" | "+s[1],
  subject_en:s[0],subject_hi:s[1],
  offer_name:nm,offer_link:link,offer_benefit:ben,offer_benefit_hi:benHi,
  message_en:en,message_hi:hi,
  message:en+"\n\n"+hi+"\n\nResume / फिर से शुरू करें: "+siteUrl()+"\nOffer / ऑफ़र: "+link+"\nHelp / सहायता (WhatsApp): https://wa.me/"+WA+" ("+WA_SHOW+")",

 };

function sendMail(params,c){
 return loadSdk().then(function(ej){return ej.send(c.service,c.template,params,{publicKey:c.publicKey})});
}
function leaseOk(){var now=Date.now(),v=rd(K.lock,0);if(v&&now-v<20000)return false;wr(K.lock,now);return rd(K.lock,0)===now}
var busy=false;
function tick(){
 var l=lead(),c=cfgGet();
 if(!active(l)||busy)return Promise.resolve();
 var now=Date.now();schedule();var a=orders();
 var due=a.filter(function(x){return x.status==="pending"&&x.sent<c.maxPer&&x.next&&x.next<=now}).sort(function(p,q){return p.next-q.next})[0];
 if(!due)return Promise.resolve();
 if(now-rd(K.sent,0)<c.minH*HOUR*0.9)return Promise.resolve();
 if(!c.template||!c.publicKey)return Promise.resolve();
 if(!leaseOk())return Promise.resolve();
 busy=true;var params=compose(due,l,c);
 return sendMail(params,c).then(function(){
  var b=orders(),x=b.find(function(y){return y.offerId===due.offerId&&y.status==="pending"});
  if(x){x.sent++;x.last=Date.now();x.next=x.sent>=c.maxPer?0:x.last+HOUR*(c.minH+Math.random()*Math.max(0,c.maxH-c.minH));if(x.sent>=c.maxPer)x.status="done"}
  wr(K.ord,b);wr(K.sent,Date.now());addLog({to:l.email,offer:due.name,subject:params.subject,ok:true});
 }).catch(function(err){
  var b=orders(),x=b.find(function(y){return y.offerId===due.offerId&&y.status==="pending"});if(x){x.next=Date.now()+15*60000;wr(K.ord,b)}
  addLog({to:l.email,offer:due.name,subject:params.subject,ok:false,err:String(err&&(err.text||err.message)||err).slice(0,120)});
 }).then(function(){busy=false;bar()});
}
setInterval(function(){tick()},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});

 $("mkSvc").value=c.service;$("mkTpl").value=c.template;$("mkKey").value=c.publicKey;$("mkMin").value=c.minH;$("mkMax").value=c.maxH;$("mkCap").value=c.maxPer;
 var okc=g.filter(function(x){return x.ok}).length;
 $("mkKpi").innerHTML='<div class="kpi"><b>'+(l?1:0)+'</b><span>Subscribers (this browser)</span></div><div class="kpi"><b>'+o.filter(function(x){return x.status==="pending"}).length+'</b><span>Pending</span></div><div class="kpi"><b>'+okc+'</b><span>Emails sent</span></div><div class="kpi"><b>'+(g.length-okc)+'</b><span>Failed</span></div>';
 var rows=o.map(function(x){return"<tr><td>"+E(x.name)+"</td><td>"+E(l&&l.email||"-")+"</td><td>"+E(x.status)+"</td><td>"+x.sent+"</td><td>"+E(fmt(x.next))+"</td></tr>"}).join("");
 var lg=g.slice(-8).reverse().map(function(x){return"<tr><td>"+E(fmt(x.ts))+"</td><td>"+E(x.offer)+"</td><td>"+(x.ok?'<span class="mk-st">sent</span>':'<span class="mk-st off">failed</span> '+E(x.err||""))+"</td></tr>"}).join("");
 $("mkTbl").innerHTML='<table class="tbl"><tr><th>Offer</th><th>Email</th><th>Status</th><th>Sent</th><th>Next</th></tr>'+(rows||'<tr><td colspan="5">No orders yet.</td></tr>')+'</table>'+(lg?'<div class="sh4">Recent sends</div><table class="tbl">'+lg+'</table>':"");
}

 orders().forEach(function(x){rows.push([l&&l.email||"",l&&l.consent?"yes":"no",l&&l.unsub?"yes":"no",x.name,x.status,x.sent,new Date(x.ts).toISOString()])});
